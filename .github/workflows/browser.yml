name: Browser checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'tests/**', '.github/workflows/browser.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/browser-smoke.cjs
